services:
  postgres:
    image: postgres:17
    container_name: tienda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tienda_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tienda_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
